num_envs: 1024 # choose appropriate value for task, 1024 for unscrew/lift
max_training_iterations: 1500 # RL learning iterations, 800 for lift, 1300 for unscrew

parameters_to_tune: 
  - 'reward.reaching_object.weight'
  - 'reward.lifting_object.weight'
  - 'reward.object_goal_tracking.weight'
  - 'reward.object_goal_tracking_fine_grained.weight'
  - 'reward.action_rate.weight'
  - 'reward.joint_vel.weight'
