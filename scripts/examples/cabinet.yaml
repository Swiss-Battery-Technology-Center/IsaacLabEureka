task: "Isaac-Open-Drawer-Franka-v0" # "SBTC-Lift-Cube-Franka-OSC-v0" "SBTC-Unscrew-Franka-OSC-v0"

# eureka parallel runs for evolutionary search, at each iteration
# under the hood it runs sequentially
# supported only for manager-based tuning
num_parallel_runs: 2
random_start: True # True if you want to start with random tuning, False if you want to use tuning from source code
random_evolution: False
resume:
  enabled: False # True if you want to resume from a previous run, False if fresh start
  prev_iterations_path: "" # path to desired eureka_iterations.txt file(including filename!), only for resume = True

max_eureka_iterations: 2 # one iteration consists of full RL training + getting a new reward/ppo tuning from llm
eureka_task: "reward_weight_tuning" # "ppo_tuning" or "reward_weight_tuning"
env_seed: 42

# LLM-related arguments
gpt_model: "deepseek/deepseek-r1:free" # "deepseek/deepseek-chat-v3-0324:free" or "google/gemma-3-12b-it:free", any free model from https://openrouter.ai/models?max_price=0
temperature: 1
use_cache: True # True to use cached summary of env source code, False to read fresh

# IsaacLab related arguments
num_envs: 1024 # choose appropriate value for task, 1024 for unscrew/lift
max_training_iterations: 600 # RL learning iterations, 800 for lift, 1300 for unscrew
feedback_subsampling: 10 # adaptive to max learning iterations, 10 will sample 10 times during a full RL training, 20 will sample 20 times
rl_library: "rsl_rl" # "rsl_rl" , "skrl" supported
video: False
# your choice of parameters to tune(reward/curriculum terms or ppo hyperparameters)

# for reward/curriculum tuning, unscrew
parameters_to_tune: 
  - 'reward.approach_ee_handle.weight'
  - 'reward.align_ee_handle.weight'
  - 'reward.approach_gripper_handle.weight'
  - 'reward.align_grasp_around_handle.weight'
  - 'reward.grasp_handle.weight'
  - 'reward.open_drawer_bonus.weight'
  - 'reward.multi_stage_open_drawer.weight'
  - 'reward.action_rate_l2.weight'
  - 'reward.joint_vel.weight'

single_run: True

env_type: "manager_based" # "manager_based" or "direct"